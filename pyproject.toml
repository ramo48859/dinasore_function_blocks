[project]
name = "dinasore-function-blocks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "influxdb-client>=1.48.0",
    "numpy>=2.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]

[project.entry-points."dinasore.plugins"]
dinasore_function_blocks = "dinasore_function_blocks"  # Register the entire plugin, not individual function blocks

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinasore_function_blocks"]
